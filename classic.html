<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jhair Lescano | Links</title>
    <link id="favicon" rel="icon" href="assets/images/favicon-dark.svg" />
    <meta name="title" content="Jhair Lescano | Links" />
    <meta name="description" content="Perfil personal de Jhair Lescano con enlaces a redes sociales, botones de contacto y una breve introducción." />
    <meta name="keywords" content="Jhair Lescano, perfil personal, redes sociales, contacto, data engineer" />
    <meta name="author" content="Jhair Lescano" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jhair Lescano | Links" />
    <meta property="og:description" content="Perfil personal de Jhair Lescano con enlaces a redes sociales y contacto." />
    <meta property="og:image" content="assets/images/Perfil2.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Jhair Lescano | Links" />
    <meta property="twitter:description" content="Perfil personal de Jhair Lescano con enlaces a redes sociales y contacto." />
    <meta property="twitter:image" content="assets/images/Perfil2.jpg" />

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />

    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/classic_styles.css" />
  </head>
  <body>

    <!-- Dark Mode Toggle -->
    <div id="dark-mode-toggle" class="position-absolute top-0 end-0 m-3"></div>

    <!--=============== MAIN CONTAINER ===============-->
    <main class="container text-center py-5">

      <!--=============== HEADER SECTION ===============-->
      <section class="head-section animate__animated animate__fadeInDown">
        <img src="assets/images/Perfil2.jpg" alt="profile-picture" class="rounded-circle img-fluid mb-3 animate__animated animate__fadeInLeft" style="width: 8rem" />

        <h1 class="fw-bold animate__animated animate__fadeInRight">
          Jhair Lescano
        </h1>

        <!-- New Buttons -->
        <div class="button-container">

          <!-- href y texto se completan desde js/data.js (PROFILE) -->
          <a id="phone-btn" href="#" class="btn btn-dark btn-lg number-btn">
            <i class="fas fa-phone"></i> <span id="phone-text"></span>
          </a>

          <a id="mail-btn" href="#" class="btn btn-dark btn-sm mail-btn">
            <i class="fas fa-envelope"></i>
          </a>

          <a class="btn btn-dark btn-sm share-btn" id="shareBtn">
            <i class="fas fa-share-alt"></i>
          </a>
        </div>

        <p class="lead animate__animated animate__fadeInUp">
          DBA & Analista de Datos Senior | Desarrollador Backend en Microservicios |
          Experiencia en SQL Server, Oracle y Linux
        </p>
      </section>

      <!--=============== SHARE MODE ===============-->
      <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="shareModalLabel">Share This</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

              <!-- Flexbox Layout for Social Media Buttons -->
              <div class="social-media-container">
                <div class="social-card">
                  <button class="btn btn-outline-primary social-btn" onclick="shareOn('facebook')">
                    <i class="fab fa-facebook"></i> Facebook
                  </button>
                </div>

                <div class="social-card">
                  <button class="btn btn-outline-info social-btn" onclick="shareOn('twitter')">
                    <i class="fab fa-twitter"></i> Twitter
                  </button>
                </div>

                <div class="social-card">
                  <button class="btn btn-outline-primary social-btn" onclick="shareOn('linkedin')">
                    <i class="fab fa-linkedin"></i> LinkedIn
                  </button>
                </div>

                <div class="social-card">
                  <button class="btn btn-outline-danger social-btn" onclick="shareOn('whatsapp')">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                  </button>
                </div>

                <div class="social-card">
                  <button class="btn btn-outline-dark social-btn" onclick="shareOn('email')">
                    <i class="fas fa-envelope"></i> Email
                  </button>
                </div>
              </div>

              <!-- URL Copy Section -->
              <div class="copy-url-container mt-3">
                <input type="text" id="shareUrl" class="form-control" value="" readonly />
                <button id="copyBtn" class="btn" data-clipboard-target="#shareUrl">
                  <i class="fas fa-copy me-2"></i> Copy
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!--=============== LINKS SECTION ===============-->
      <!-- Los enlaces se generan desde js/data.js (LINKS) en classic_script.js -->
      <section class="social-links animate__animated animate__fadeInUp">
        <ul id="links-list" class="list-unstyled"></ul>
      </section>

      <!--=============== TOGGLE BTN ===============-->
      <div id="dark-mode-toggle" class="position-fixed top-0 end-0 m-3">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2 shadow-sm">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>
      </div>

      <!--=============== TERMINAL MODE BTN ===============-->
      <a href="index.html" class="btn btn-dark shadow-sm position-fixed bottom-0 end-0 m-3" title="Volver al modo terminal">
        <i class="fas fa-terminal me-2"></i>Modo Terminal
      </a>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Clipboard.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.6/clipboard.min.js" defer></script>

    <!-- Shared profile data -->
    <script src="js/data.js" defer></script>

    <script src="js/classic_script.js" defer></script>
  </body>
</html>
