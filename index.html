<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jhair Lescano - Terminal</title>
    <link id="favicon" rel="icon" href="assets/images/favicon-dark.svg" />
    <meta name="title" content="Jhair Lescano - Terminal" />
    <meta name="description" content="Personal profile page in a terminal style." />

    <!-- Google Fonts for Monospace -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome (for icons in links) -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />

    <!-- Terminal CSS -->
    <link rel="stylesheet" href="assets/css/terminal.css" />
  </head>
  <body>
    <!-- Terminal window frame (macOS/Linux style) -->
    <div class="terminal-window">
      <div class="titlebar">
        <span class="tb-dot tb-red"></span>
        <span class="tb-dot tb-yellow"></span>
        <span class="tb-dot tb-green"></span>
        <span class="tb-title">guest@jhair-lescano: ~</span>
      </div>
      <div id="terminal-container" class="terminal" tabindex="0">
        <div id="output"></div>
        <div id="input-line" class="input-line" style="display: none;">
          <span class="prompt">guest@jhair-lescano:~$</span>
          <span id="input-text"></span><span class="cursor">_</span>
        </div>
      </div>
    </div>

    <!-- Hidden input for mobile keyboards -->
    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <!-- Fixed switch to classic GUI version (for users unfamiliar with terminals) -->
    <a href="classic.html" id="gui-switch" class="gui-switch" title="Ver la versión clásica">
      <i class="fas fa-desktop"></i> Ver versión GUI
    </a>

    <script src="js/data.js" defer></script>
    <script src="js/terminal.js" defer></script>
  </body>
</html>
